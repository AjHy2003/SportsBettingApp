name: probe-potential
# Temporary: which opportunity ("potential") stats are reachable from a runner.
on:
  push:
    branches: ["claude/potential"]
    paths: ["tools/probe-potential.py", ".github/workflows/probe-potential.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe-potential.py
      - name: Commit results
        if: always()
        run: |
          mkdir -p probe-out && cp probe-potential.json probe-out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-out || true
          git commit -qm "Probe results" || echo "nothing to commit"
          git pull -q --rebase origin claude/potential || true
          git push -q origin HEAD:claude/potential
