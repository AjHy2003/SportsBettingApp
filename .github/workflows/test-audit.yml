name: test-audit
on:
  push:
    branches: ["claude/audit"]
    paths-ignore: ["e2e-out/**"]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit live data
        run: |
          mkdir -p e2e-out
          curl -sf https://ajhy2003.github.io/SportsBettingApp/data/picks/today.json -o today.json
          git fetch -q origin picks-data && git show origin/picks-data:history.json > history.json
          node tools/audit.mjs today.json history.json e2e-out/audit.json
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f e2e-out || true
          git commit -qm "Audit results" || echo "nothing to commit"
          git push -q origin HEAD:claude/audit
