name: probe-live
on:
  push:
    branches: ["claude/live"]
    paths: ["tools/probe/**", ".github/workflows/probe-live.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe/live_probe.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-live || true
          git commit -qm "Live probe results" || echo "nothing to commit"
          git push -q origin HEAD:claude/live
