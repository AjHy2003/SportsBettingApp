name: test-accounts
# Temporary: accounts against the Firebase emulators (real gstatic SDK), the slip/share
# flow in E2E, and a DraftKings multi-leg link probe. Sends nothing anywhere.
on:
  push:
    branches: ["claude/accounts"]
    paths-ignore: ["account-out/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install tools
        run: |
          npm i -g firebase-tools@13 >/dev/null
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium
      - name: Accounts against the emulators
        run: |
          (python3 -m http.server 8765 >/dev/null 2>&1 &)
          firebase emulators:exec --project demo-picklab --only auth,firestore "NODE_PATH=/tmp/pw/node_modules node tools/account-test.cjs http://localhost:8765/ '' account-out" 2>&1 | tee account.log
      - name: DraftKings multi-leg probe
        if: always()
        continue-on-error: true
        run: NODE_PATH=/tmp/pw/node_modules node tools/dk-probe.cjs account-out/dk
      - name: Commit results
        if: always()
        run: |
          mkdir -p account-out && cp account.log account-out/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f account-out || true
          git commit -qm "Account test results" || echo "nothing to commit"
          git pull -q --rebase origin claude/accounts || true
          git push -q origin HEAD:claude/accounts
