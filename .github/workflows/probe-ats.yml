name: probe-ats
on:
  push:
    branches: ["claude/trends"]
    paths: ["tools/probe/**", ".github/workflows/probe-ats.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe/ats_probe.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-ats || true
          git commit -qm "ATS probe results" || echo "nothing to commit"
          git push -q origin HEAD:claude/trends
