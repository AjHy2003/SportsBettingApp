name: probe-news
on:
  push:
    branches: ["claude/news"]
    paths-ignore: ["probe-news/**", "e2e-out/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/probe/news_probe.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probe-news || true
          git commit -qm "News probe results" || echo "nothing to commit"
          git push -q origin HEAD:claude/news
